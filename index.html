<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Quintina</title>
<style>
  :root {
    --paper: #f6f1de;
    --ink: #1d1b16;
    --tie: #38342c;
    --tie-ink: #000000;
    --divider: #8f8c80;
    --title-bg: #d2cfc2;
    --col-x-bg: #d0cdbf;
    --green: #a8df8e;
    --green-ink: #17330a;
    --red: #f4a29a;
    --red-ink: #3a110e;
    /* Base cell - responsive to both width and height for iPad 5th gen */
    --cell: clamp(38px, min(calc((100vw - 32px) / 10), calc((100dvh - 240px) / 13)), 72px);

    /* Records highlight badges - Softer Pastels */
    --rec-red: #fbc6c2;
    --rec-red-ink: #4a1512;
    --rec-green: #c8e6c9;
    --rec-green-ink: #113315;
    --rec-hdr: #d0cdbf;

    /* Tabla winner/loser cell highlights - Gentle Pastels */
    --win-bg: #b8e0c8;
    --lose-bg: #e8c4c4;
    --tabla-card-bg: #f6f1de;
    --tabla-header-bg: #2d2b26;
    --tabla-accent-row: #fffdf0;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    padding: 8px 8px 16px; /* reduced for iPad fit */
    /* original was 16px 8px 32px */

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  .app-header {
    margin-bottom: 12px;
    text-align: center;
  }

  .board-scroll {
    overflow-x: auto;
    width: 100%;
    max-width: 100%;
    padding-bottom: 12px;
    -webkit-overflow-scrolling: touch;
    display: flex;
    justify-content: center;
  }

  table.quintina {
    border-collapse: collapse;
    border: 4px solid var(--ink);
    background: var(--paper);
    margin-left: auto;
    margin-right: auto;
    table-layout: fixed;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }

  table.quintina th, table.quintina td {
    border: 1px solid #c9c5b6;
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }

  th.title-cell {
    background: var(--title-bg);
    font-weight: 700;
    font-size: 0.55rem;
    height: 16px;
    padding: 0px 1px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  td.stat-cell {
    height: 32px;
    font-weight: 900;
    font-size: clamp(0.95rem, 2.2vw, 1.25rem);
    background: var(--paper);
    position: relative;
    touch-action: manipulation;
  }

  td.stat-cell.vergas { color: #4a7c1f; }
  td.stat-cell.borres { color: #6b6a63; }
  td.stat-cell.vergas.vergas-beat-record { background: #f0993e !important; color: #3a1f04; }
  td.stat-cell.borres.vergas-beat-record { background: #f0993e !important; color: #3a1f04; }
  td.stat-cell.beat-record { background: #f0993e !important; color: #3a1f04; }
  td.racha-beat-record { background: #f0993e !important; color: #3a1f04 !important; }
  .th-racha-badge.racha-beat-record { background: #f0993e !important; color: #3a1f04 !important; }
  td.stat-cell.tiros { cursor: default; user-select: none; pointer-events: none; }
  td.stat-cell.tiro-turn { background: var(--green); color: var(--green-ink); }
  td.stat-cell.tiro-error { background: var(--red) !important; color: var(--red-ink) !important; }

  td.stat-cell.dormida-active {
    background: var(--red) !important;
    color: var(--red-ink) !important;
  }

  select.dormida-select {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(0.95rem, 2.2vw, 1.25rem);
    text-align: center;
    text-align-last: center;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }

  tr.gm-header-row th {
    border-top: 4px solid var(--ink) !important;
  }

  th.gm-head {
    width: var(--cell);
    height: 36px;
    font-size: clamp(1.05rem, 2.5vw, 1.35rem);
    font-weight: 900;
    background: var(--paper);
    -webkit-text-stroke: 0.5px var(--ink);
  }

  td.score-cell {
    width: var(--cell);
    height: var(--cell);
    padding: 0;
  }

  select.cell-select {
    width: var(--cell);
    height: var(--cell);
    border: none;
    background: transparent;
    text-align: center;
    text-align-last: center;
    font-family: inherit;
    font-size: clamp(1.5rem, 4.4vw, 2.6rem);
    font-weight: 900;
    color: var(--ink);
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    cursor: pointer;
    border-radius: 0;
    touch-action: manipulation;
  }

  /* Solo el 100 de generala doble - achicado para entrar en casilla cuadrada */
  select.cell-select.is-100 {
    font-size: clamp(1.05rem, 2.8vw, 1.75rem) !important;
    letter-spacing: -0.03em;
  }

  select.cell-select option {
    font-size: 1.4rem;
    font-weight: 800;
    background: var(--paper);
    color: var(--ink);
  }

  select.cell-select:focus {
    outline: 2px solid var(--divider);
    outline-offset: -2px;
  }

  td.tie {
    background: var(--tie) !important;
    border-top-color: var(--tie) !important;
    border-bottom-color: var(--tie) !important;
    border-left-color: var(--ink) !important;
    border-right-color: var(--ink) !important;
  }

  td.tie select, select.cell-select.is-tie {
    background: var(--tie) !important;
    color: var(--tie-ink) !important;
    -webkit-text-fill-color: var(--tie-ink) !important;
  }

  tr.diff-row td {
    height: 36px;
    font-size: clamp(1.05rem, 2.5vw, 1.35rem);
    font-weight: 800;
    background: var(--paper);
  }

  tr.subtotal-row td {
    font-weight: 900;
    background: var(--paper);
    height: 38px;
    font-size: clamp(1.1rem, 2.6vw, 1.45rem);
    color: #444139;
  }

 td.winner-cell {
   width: calc(var(--cell) * 2);
   height: var(--cell);
   font-weight: 900;
   font-size: clamp(3rem, 9.5vw, 4.8rem);
   background: var(--paper);
   line-height: var(--cell);
   text-align: center;
 }

  td.winner-cell.winner-win {
    background: var(--green) !important;
    color: var(--green-ink) !important;
  }
  td.winner-cell.winner-lose {
    background: var(--red) !important;
    color: var(--red-ink) !important;
  }
  td.winner-cell.winner-tie {
    background: #b8b5a8 !important;
    color: #2d2b26 !important;
  }

  button.top-action-btn {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(0.68rem, 1.5vw, 0.9rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1px;
    transition: all 0.15s ease;
    touch-action: manipulation;
  }

  button.top-action-btn:active {
    background: var(--ink);
    color: var(--paper);
  }

  button.top-action-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .board-end {
    border-right: 5px solid var(--ink) !important;
  }

  .thick-top th, .thick-top td {
    border-top: 4px solid var(--ink) !important;
  }

  .thick-bottom th, .thick-bottom td {
    border-bottom: 4px solid var(--ink) !important;
  }

  .actions-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    width: 100%;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  .actions {
    text-align: center;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  .actions-separated {
    margin-top: 4px;
    display: flex;
    justify-content: center;
    width: 100%;
    padding-right: 2px;
  }

  .match-timer {
    margin-top: 18px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .match-timer .timer-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.6;
    margin-bottom: 4px;
  }

  .match-timer .timer-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

  function getSelect(board, cat, player) {
    return document.querySelector('select[data-board="' + board + '"][data-cat="' + cat + '"][data-player="' + player + '"]');
  }

  function scoreValue(v) {
    if (v === '' || v === null || v === undefined) return null;
    if (v === 'X') return 0;
    return parseInt(v, 10) || 0;
  }

  function getSubsets(arr) {
    const result = [];
    function backtrack(start, current) {
      if (current.length > 0) {
        result.push(current.slice());
      }
      for (let i = start; i < arr.length; i++) {
        current.push(arr[i]);
        backtrack(i + 1, current);
        current.pop();
      }
    }
    backtrack(0, []);
    result.sort(function(a, b) { return a.length - b.length; });
    return result;
  }

  function recomputeTies(board) {
    CATEGORIES.forEach(function(cat) {
      const selG = getSelect(board, cat.key, 'G');
      const selM = getSelect(board, cat.key, 'M');
      if (selG) { selG.classList.remove('is-tie'); selG.parentElement.classList.remove('tie'); }
      if (selM) { selM.classList.remove('is-tie'); selM.parentElement.classList.remove('tie'); }
    });

    const eligible = CATEGORIES
      .map(function(cat) {
        const selG = getSelect(board, cat.key, 'G');
        const selM = getSelect(board, cat.key, 'M');
        return {
          key: cat.key,
          gStr: selG ? selG.value : '',
          mStr: selM ? selM.value : ''
        };
      })
      .filter(function(c) { return c.gStr !== '' && c.mStr !== ''; })
      .map(function(c) {
        return {
          key: c.key,
          g: scoreValue(c.gStr),
          m: scoreValue(c.mStr)
        };
      });

    if (eligible.length === 0) return;

    const tieKeys = {};
    let remaining = eligible.slice();

    while (remaining.length > 0) {
      const subsets = getSubsets(remaining);
      let foundSubset = null;

      for (let i = 0; i < subsets.length; i++) {
        const sub = subsets[i];
        let sumG = 0, sumM = 0;
        for (let j = 0; j < sub.length; j++) {
          sumG += sub[j].g;
          sumM += sub[j].m;
        }
        if (sumG === sumM) {
          foundSubset = sub;
          break;
        }
      }

      if (foundSubset) {
        const subKeys = {};
        foundSubset.forEach(function(c) {
          tieKeys[c.key] = true;
          subKeys[c.key] = true;
        });
        remaining = remaining.filter(function(c) { return !subKeys[c.key]; });
      } else {
        break;
      }
    }

    Object.keys(tieKeys).forEach(function(k) {
      const selG = getSelect(board, k, 'G');
      const selM = getSelect(board, k, 'M');
      if (selG) { selG.classList.add('is-tie'); selG.parentElement.classList.add('tie'); }
      if (selM) { selM.classList.add('is-tie'); selM.parentElement.classList.add('tie'); }
    });
    if (typeof updateGlobalWinnerColors === 'function') updateGlobalWinnerColors();
  }

  const CATEGORY_MAX = {};
  CATEGORIES.forEach(function(cat) {
    const nums = cat.options.filter(function(o) { return o !== 'X'; }).map(Number);
    CATEGORY_MAX[cat.key] = Math.max.apply(null, nums);
  });

  function evaluateBoard(board) {
    let sumG = 0, sumM = 0;
    const remainingG = [], remainingM = [];
    CATEGORIES.forEach(function(cat) {
      const selG = getSelect(board, cat.key, 'G');
      const selM = getSelect(board, cat.key, 'M');
      const vG = selG ? selG.value : '';
      const vM = selM ? selM.value : '';
      if (vG === '') remainingG.push(cat.key); else sumG += scoreValue(vG);
      if (vM === '') remainingM.push(cat.key); else sumM += scoreValue(vM);
    });

    const potentialG = sumG + remainingG.reduce(function(s, k) { return s + CATEGORY_MAX[k]; }, 0);
    const potentialM = sumM + remainingM.reduce(function(s, k) { return s + CATEGORY_MAX[k]; }, 0);
    const complete = remainingG.length === 0 && remainingM.length === 0;
    const filledG = CATEGORIES.length - remainingG.length;
    const filledM = CATEGORIES.length - remainingM.length;

    let winner = null, dash = false;
    if (complete) {
      if (sumG === sumM) dash = true;
      else winner = sumG > sumM ? 'G' : 'M';
    } else if (sumG > sumM && potentialM <= sumG) {
      winner = 'G';
    } else if (sumM > sumG && potentialG <= sumM) {
      winner = 'M';
    }

    return { sumG: sumG, sumM: sumM, filledG: filledG, filledM: filledM, winner: winner, dash: dash };
  }
  function computeWeightedMatchResult() {
    let weightedG = 0, weightedM = 0;
    let boardsWonG = 0, boardsWonM = 0;
    for (let b = 1; b <= BOARDS; b++) {
      const res = evaluateBoard(b);
      if (res.winner === 'G') { weightedG += b; boardsWonG++; }
      else if (res.winner === 'M') { weightedM += b; boardsWonM++; }
    }
    const dormidaPtsG = parseInt(dormidaG, 10) || 0;
    const dormidaPtsM = parseInt(dormidaM, 10) || 0;
    const totalG = weightedG + dormidaPtsG;
    const totalM = weightedM + dormidaPtsM;
    let winner = null;
    if (totalG > totalM) winner = 'G';
    else if (totalM > totalG) winner = 'M';
    return { weightedG, weightedM, dormidaPtsG, dormidaPtsM, totalG, totalM, winner, boardsWonG, boardsWonM };
  }



  function updateSubtotal(board) {
    const res = evaluateBoard(board);
    const sumG = res.sumG, sumM = res.sumM, winner = res.winner, dash = res.dash;

    document.getElementById('subtotal-' + board + '-G').textContent = res.filledG > 0 ? String(sumG) : '';
    document.getElementById('subtotal-' + board + '-M').textContent = res.filledM > 0 ? String(sumM) : '';

    const diffG = document.getElementById('diff-' + board + '-G');
    const diffM = document.getElementById('diff-' + board + '-M');
    diffG.textContent = '';
    diffM.textContent = '';
    if (sumG > sumM) diffG.textContent = String(sumG - sumM);
    else if (sumM > sumG) diffM.textContent = String(sumM - sumG);

    const winnerCell = document.getElementById('winner-' + board);
    if (winnerCell) {
      winnerCell.classList.remove('winner-win','winner-lose','winner-tie');
      if (winner) {
        winnerCell.textContent = winner;
      } else if (dash) {
        winnerCell.textContent = 'ø';
      } else {
        winnerCell.textContent = '';
      }
    }
    updateGlobalWinnerColors();
  }

  function updateGlobalWinnerColors() {
    // Nuevo comportamiento: solo pintar verde/rojo/gris cuando las 5 quintinas tengan ganador o empate
    let boardsWithResult = 0;
    for (let b = 1; b <= BOARDS; b++) {
      const r = evaluateBoard(b);
      if (r.winner || r.dash) boardsWithResult++;
    }
    const allDecided = (boardsWithResult === BOARDS);

    // Si no están todas decididas, quitar colores y salir (dejar solo letras G/M/ø sin fondo)
    if (!allDecided) {
      for (let b = 1; b <= BOARDS; b++) {
        const cell = document.getElementById('winner-' + b);
        if (cell) cell.classList.remove('winner-win','winner-lose','winner-tie');
      }
      return;
    }

    const overall = computeWeightedMatchResult ? computeWeightedMatchResult() : null;
    if (!overall) return;

    // Si todas decididas pero hay empate total ponderado -> todo gris
    if (overall.totalG === overall.totalM) {
      for (let b = 1; b <= BOARDS; b++) {
        const cell = document.getElementById('winner-' + b);
        if (cell && cell.textContent) {
          cell.classList.remove('winner-win','winner-lose');
          cell.classList.add('winner-tie');
        }
      }
      return;
    }

    // Todas decididas y hay ganador ponderado -> verde ganador ponderado, rojo perdedor, gris empates individuales
    for (let b = 1; b <= BOARDS; b++) {
      const res = evaluateBoard(b);
      const cell = document.getElementById('winner-' + b);
      if (!cell || !cell.textContent) continue;
      cell.classList.remove('winner-win','winner-lose','winner-tie');
      if (res.dash) {
        cell.classList.add('winner-tie');
      } else if (res.winner === overall.winner) {
        cell.classList.add('winner-win');
      } else {
        cell.classList.add('winner-lose');
      }
    }
  }

  function isVergaScore(catKey, value) {
    if (value === '' || value === undefined || value === null) return false;
    const catDef = CATEGORIES.find(function(c) { return c.key === catKey; });
    if (!catDef) return false;
    return catDef.isGenerala ? (value !== 'X') : (catDef.max !== null && value === String(catDef.max));
  }

  function updateMatchStats() {
    let vergasG = 0, vergasM = 0, borresG = 0, borresM = 0;
    for (let b = 1; b <= BOARDS; b++) {
      CATEGORIES.forEach(function(cat) {
        const selG = getSelect(b, cat.key, 'G');
        const selM = getSelect(b, cat.key, 'M');
        const vG = selG ? selG.value : '';
        const vM = selM ? selM.value : '';
        if (vG === 'X') borresG++;
        if (vM === 'X') borresM++;
        const isGeneralaG = cat.isGenerala ? (vG !== '' && vG !== 'X') : (cat.max !== null && vG === String(cat.max));
        const isGeneralaM = cat.isGenerala ? (vM !== '' && vM !== 'X') : (cat.max !== null && vM === String(cat.max));
        if (isGeneralaG) vergasG++;
        if (isGeneralaM) vergasM++;
      });
    }
    const vergaRecordRow = findRecordRowById('vergas_en_un_partido');
    const recG = vergaRecordRow && vergaRecordRow.g && vergaRecordRow.g.v ? parseInt(vergaRecordRow.g.v, 10) : 0;
    const recM = vergaRecordRow && vergaRecordRow.m && vergaRecordRow.m.v ? parseInt(vergaRecordRow.m.v, 10) : 0;

    const cellVergasG = document.getElementById('vergas-G');
    const cellVergasM = document.getElementById('vergas-M');
    cellVergasG.textContent = vergasG > 0 ? String(vergasG) : '';
    cellVergasM.textContent = vergasM > 0 ? String(vergasM) : '';
    cellVergasG.classList.toggle('vergas-beat-record', vergasG > recG);
    cellVergasM.classList.toggle('vergas-beat-record', vergasM > recM);
    let recordsChanged = false;
    if (vergasG > recG || vergasM > recM) {
      if (vergasG > recG) recordsBeatenThisMatch.vergas_en_un_partido.g = true;
      if (vergasM > recM) recordsBeatenThisMatch.vergas_en_un_partido.m = true;
      checkAndUpdateVergasRecord(vergasG, vergasM);
      recordsChanged = true;
    }

    const partidoMasVergasRow = findRecordRowById('partido_mas_vergas');
    const totalVergasRec = partidoMasVergasRow && partidoMasVergasRow.val ? parseInt(partidoMasVergasRow.val, 10) : 0;
    if ((vergasG + vergasM) > totalVergasRec) {
      recordsBeatenThisMatch.partido_mas_vergas = true;
      checkAndUpdatePartidoMasVergasRecord(vergasG + vergasM);
      recordsChanged = true;
    }

    const borresRecordRow = findRecordRowById('borres_en_un_partido');
    const borresRecG = borresRecordRow && borresRecordRow.g && borresRecordRow.g.v ? parseInt(borresRecordRow.g.v, 10) : 0;
    const borresRecM = borresRecordRow && borresRecordRow.m && borresRecordRow.m.v ? parseInt(borresRecordRow.m.v, 10) : 0;

    const cellBorresG = document.getElementById('borres-G');
    const cellBorresM = document.getElementById('borres-M');
    cellBorresG.textContent = borresG > 0 ? String(borresG) : '';
    cellBorresM.textContent = borresM > 0 ? String(borresM) : '';
    cellBorresG.classList.toggle('vergas-beat-record', borresG > borresRecG);
    cellBorresM.classList.toggle('vergas-beat-record', borresM > borresRecM);
    if (borresG > borresRecG || borresM > borresRecM) {
      if (borresG > borresRecG) recordsBeatenThisMatch.borres_en_un_partido.g = true;
      if (borresM > borresRecM) recordsBeatenThisMatch.borres_en_un_partido.m = true;
      checkAndUpdateBorresRecord(borresG, borresM);
      recordsChanged = true;
    }

    if (recordsChanged) {
      saveRecordsData();
      buildRecordsPage();
    }
    updateRecordsAlertButton();
  }

  function getFullState() {
    const selects = {};
    document.querySelectorAll('select.cell-select').forEach(function(sel) {
      const key = sel.dataset.board + '_' + sel.dataset.cat + '_' + sel.dataset.player;
      selects[key] = sel.value;
    });
    return {
      selects: selects,
      tiroCountG: tiroCountG,
      tiroCountM: tiroCountM,
      lastPlayer: lastPlayer,
      currentTurn: currentTurn,
      errorPlayer: errorPlayer,
      dormidaG: dormidaG,
      dormidaM: dormidaM,
      vergaYaOcurrioEnPartido: vergaYaOcurrioEnPartido,
      recordsBeatenThisMatch: JSON.parse(JSON.stringify(recordsBeatenThisMatch)),
      vergaDesdeInicioActivoG: vergaDesdeInicioActivoG,
      vergaDesdeInicioActivoM: vergaDesdeInicioActivoM,
      vergaDesdeInicioG: vergaDesdeInicioG,
      vergaDesdeInicioM: vergaDesdeInicioM,
      tirosSinPrimaActivoG: tirosSinPrimaActivoG,
      tirosSinPrimaActivoM: tirosSinPrimaActivoM,
      tirosSinPrimaG: tirosSinPrimaG,
      tirosSinPrimaM: tirosSinPrimaM
    };
  }

  function pushStateBeforeChange() {
    if (currentState) {
      historyStack.push(JSON.parse(JSON.stringify(currentState)));
      redoStack = [];
      updateUndoRedoBtns();
    }
  }

  function applyState(state) {
    if (!state) return;
    if (state.selects) {
      Object.keys(state.selects).forEach(function(key) {
        const parts = key.split('_');
        const sel = getSelect(parts[0], parts[1], parts[2]);
        if (sel) { sel.value = state.selects[key]; if(state.selects[key]==='100') sel.classList.add('is-100'); else sel.classList.remove('is-100'); }
      });
    }

    tiroCountG = state.tiroCountG || 0;
    tiroCountM = state.tiroCountM || 0;
    lastPlayer = state.lastPlayer || null;
    currentTurn = state.currentTurn || 'G';
    errorPlayer = state.errorPlayer || null;
    dormidaG = state.dormidaG || '';
    dormidaM = state.dormidaM || '';
    vergaYaOcurrioEnPartido = !!state.vergaYaOcurrioEnPartido;
    if (state.recordsBeatenThisMatch) recordsBeatenThisMatch = JSON.parse(JSON.stringify(state.recordsBeatenThisMatch));
    vergaDesdeInicioActivoG = (state.vergaDesdeInicioActivoG !== undefined) ? state.vergaDesdeInicioActivoG : true;
    vergaDesdeInicioActivoM = (state.vergaDesdeInicioActivoM !== undefined) ? state.vergaDesdeInicioActivoM : true;
    vergaDesdeInicioG = state.vergaDesdeInicioG || 0;
    vergaDesdeInicioM = state.vergaDesdeInicioM || 0;
    tirosSinPrimaActivoG = (state.tirosSinPrimaActivoG !== undefined) ? state.tirosSinPrimaActivoG : true;
    tirosSinPrimaActivoM = (state.tirosSinPrimaActivoM !== undefined) ? state.tirosSinPrimaActivoM : true;
    tirosSinPrimaG = state.tirosSinPrimaG || 0;
    tirosSinPrimaM = state.tirosSinPrimaM || 0;

    const selG = document.getElementById('dormida-select-G');
    const selM = document.getElementById('dormida-select-M');
    if (selG) selG.value = dormidaG;
    if (selM) selM.value = dormidaM;

    for (let b = 1; b <= BOARDS; b++) {
      recomputeTies(b);
      updateSubtotal(b);
    }
    updateMatchStats();
    renderTiros();
    updateDormidasUI();
  }

  function undoAction() {
    if (historyStack.length === 0) return;
    redoStack.push(JSON.parse(JSON.stringify(currentState)));
    const previous = historyStack.pop();
    applyState(previous);
    currentState = previous;
    updateUndoRedoBtns();
  }

  function redoAction() {
    if (redoStack.length === 0) return;
    historyStack.push(JSON.parse(JSON.stringify(currentState)));
    const next = redoStack.pop();
    applyState(next);
    currentState = next;
    updateUndoRedoBtns();
  }

  function updateUndoRedoBtns() {
    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');
    if (btnUndo) btnUndo.disabled = (historyStack.length === 0);
    if (btnRedo) btnRedo.disabled = (redoStack.length === 0);
  }

  function formatTimerValue(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    const pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    return h > 0 ? (pad(h) + ':' + pad(m) + ':' + pad(s)) : (pad(m) + ':' + pad(s));
  }

  function currentTimerElapsedMs() {
    return timerElapsedMs + (timerRunning ? (Date.now() - timerSegmentStart) : 0);
  }

  function updateTimerDisplay() {
    const el = document.getElementById('matchTimerValue');
    if (!el) return;
    el.textContent = formatTimerValue(currentTimerElapsedMs());
  }

  function updateTimerToggleBtn() {
    const btn = document.getElementById('timerToggleBtn');
    if (!btn) return;
    btn.textContent = timerRunning ? '⏸' : '▶';
    btn.setAttribute('aria-label', timerRunning ? 'Pausar cronómetro' : (timerStarted ? 'Reanudar cronómetro' : 'Iniciar cronómetro'));
  }

  function startMatchTimerIfNeeded() {
    if (timerStarted && !timerFinished) return;
    timerFinished = false;
    timerStarted = true;
    timerRunning = true;
    timerElapsedMs = 0;
    timerSegmentStart = Date.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimerDisplay, 1000);
    updateTimerDisplay();
    updateTimerToggleBtn();
  }

  function toggleMatchTimer() {
    if (timerRunning) {
      timerElapsedMs += Date.now() - timerSegmentStart;
      timerRunning = false;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
    } else {
      timerFinished = false;
      timerStarted = true;
      timerRunning = true;
      timerSegmentStart = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 1000);
    }
    updateTimerDisplay();
    updateTimerToggleBtn();
  }

  function pauseTimerOnFinish() {
    if (timerRunning) {
      timerElapsedMs += Date.now() - timerSegmentStart;
      timerRunning = false;
    }
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    timerFinished = timerStarted;
    updateTimerDisplay();
    updateTimerToggleBtn();
  }

  function resetMatchTimer() {
    timerFinished = false;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    timerElapsedMs = 0;
    timerRunning = false;
    timerStarted = false;
    timerSegmentStart = null;
    const el = document.getElementById('matchTimerValue');
    if (el) el.textContent = '00:00';
    updateTimerToggleBtn();
  }

  function onCellChange(board, player, target) {
    pushStateBeforeChange();

    if (target && target.value !== '') {
      startMatchTimerIfNeeded();
      if (player !== currentTurn) {
        errorPlayer = player;
      } else {
        errorPlayer = null;
      }
      lastPlayer = player;
      currentTurn = (player === 'G' ? 'M' : 'G');

      const isVerga = isVergaScore(target.dataset.cat, target.value);
      const isPrima = target.dataset.cat === '1';
      const isBorre = target.value === 'X';
      if (player === 'G') {
        vergaStreakG = isVerga ? vergaStreakG + 1 : 0;
        if (vergaStreakG > maxVergaStreakG) maxVergaStreakG = vergaStreakG;
        if (vergaDesdeInicioActivoG) {
          if (isVerga) { vergaDesdeInicioG++; checkAndUpdateVergasSeguidasDesdeInicioRecord(vergaDesdeInicioG, 0); }
          else { vergaDesdeInicioActivoG = false; }
        }
        if (tirosSinPrimaActivoG) {
          if (isPrima) { tirosSinPrimaActivoG = false; }
          else { tirosSinPrimaG++; checkAndUpdateTirosSinPrimaRecord('G', tirosSinPrimaG); }
        }
        if (primaDesdeInicioActivoG) {
          if (isPrima) { primaDesdeInicioG++; checkAndUpdateTirosEnPrimaRecord('G', primaDesdeInicioG); }
          else { primaDesdeInicioActivoG = false; }
        }
        borreStreakG = isBorre ? borreStreakG + 1 : 0;
        if (isBorre) checkAndUpdateBorresSeguidosRecord('G', borreStreakG);
      } else {
        vergaStreakM = isVerga ? vergaStreakM + 1 : 0;
        if (vergaStreakM > maxVergaStreakM) maxVergaStreakM = vergaStreakM;
        if (vergaDesdeInicioActivoM) {
          if (isVerga) { vergaDesdeInicioM++; checkAndUpdateVergasSeguidasDesdeInicioRecord(0, vergaDesdeInicioM); }
          else { vergaDesdeInicioActivoM = false; }
        }
        if (tirosSinPrimaActivoM) {
          if (isPrima) { tirosSinPrimaActivoM = false; }
          else { tirosSinPrimaM++; checkAndUpdateTirosSinPrimaRecord('M', tirosSinPrimaM); }
        }
        if (primaDesdeInicioActivoM) {
          if (isPrima) { primaDesdeInicioM++; checkAndUpdateTirosEnPrimaRecord('M', primaDesdeInicioM); }
          else { primaDesdeInicioActivoM = false; }
        }
        borreStreakM = isBorre ? borreStreakM + 1 : 0;
        if (isBorre) checkAndUpdateBorresSeguidosRecord('M', borreStreakM);
      }
      checkAndUpdateVergasSeguidasRecordLive();
      if (isVerga) vergaYaOcurrioEnPartido = true;
      if (player === 'M' && !vergaYaOcurrioEnPartido) {
        calculateTiroCounts();
        checkAndUpdateTirosSinVergaRecord(tiroCountM);
      }
    }

    currentState = getFullState();
    recomputeTies(board);
    updateSubtotal(board);
    updateMatchStats();
    renderTiros();
    updateUndoRedoBtns();
  }

  function findRecordRowById(id) {
    for (let ci = 0; ci < RECORDS_DATA.length; ci++) {
      const col = RECORDS_DATA[ci];
      if (!col.sections) continue;
      for (let si = 0; si < col.sections.length; si++) {
        const sec = col.sections[si];
        if (!sec.rows) continue;
        for (let ri = 0; ri < sec.rows.length; ri++) {
          if (sec.rows[ri].id === id) return sec.rows[ri];
        }
      }
    }
    return null;
  }

  function saveSpeedRecords() {
    try {
      const data = {};
      SPEED_RECORD_IDS.forEach(function(id) {
        const row = findRecordRowById(id);
        if (row) data[id] = { min: row.min, sec: row.sec, date: row.date };
      });
      localStorage.setItem('quintina_speed_records', JSON.stringify(data));
    } catch(e) {}
  }

      const data = {};
      recordRowPaths().forEach(function(p) {
        const entry = { label: p.row.label };
        RECORD_FIELDS.forEach(function(f) { if (p.row[f] !== undefined) entry[f] = p.row[f]; });
        data[p.key] = entry;
      });
      localStorage.setItem(RECORDS_STORE_KEY, JSON.stringify(data));
    } catch (e) {}
  }
  // (compatibilidad: el código de récords de borres llama a este nombre)
  function saveVergasRecords() { saveRecordsData(); }

  function loadRecordsData() {
    try {
      const raw = localStorage.getItem(RECORDS_STORE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      recordRowPaths().forEach(function(p) {
        const saved = data && data[p.key];
        if (!saved || saved.label !== p.row.label) return;
        RECORD_FIELDS.forEach(function(f) { if (saved[f] !== undefined) p.row[f] = saved[f]; });
      });
    } catch (e) {}
  }
  loadRecordsData();

  loadPalizaComments();
  try {
    const savedSpeed = localStorage.getItem('quintina_speed_records');
    if (savedSpeed) {
      const parsedSpeed = JSON.parse(savedSpeed);
      SPEED_RECORD_IDS.forEach(function(id) {
        const row = findRecordRowById(id);
        if (row && parsedSpeed[id]) {
          row.min = parsedSpeed[id].min;
          row.sec = parsedSpeed[id].sec;
          row.date = parsedSpeed[id].date;
        }
      });
    }
  } catch(e) {}


  function getNumericValue(data) {
    if (!data) return null;
    if (data.v !== undefined && data.v !== null && data.v !== '') {
      const parsed = parseFloat(data.v);
      return isNaN(parsed) ? null : parsed;
    }
    if (data.check !== undefined) {
      return data.check ? 1 : 0;
    }
    return null;
  }

  function renderRecCell(data, bgClass, beaten) {
    if (!data) return '<div class="rec-val-cell"></div>';
    const cls = (bgClass ? ('bg-' + bgClass) : 'bg-gray') + (beaten ? ' record-beaten' : '');
    if (data.check !== undefined) {
      const content = data.check ? '<span class="rec-check">✓</span>' : '';
      return '<div class="rec-val-cell ' + cls + '">' +
        content +
        (data.d ? '<span class="rec-date">' + data.d + '</span>' : '') +
      '</div>';
    }
    return '<div class="rec-val-cell ' + cls + '">' +
      (data.v !== undefined && data.v !== null && data.v !== '' ? '<span class="rec-num">' + data.v + '</span>' : '') +
      (data.d ? '<span class="rec-date">' + data.d + '</span>' : '') +
    '</div>';
  }

  function getFormattedTodayDate() {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yy = String(now.getFullYear()).slice(-2);
    return dd + '/' + mm + '/' + yy;
  }

        if (!sec.rows) return;
        sec.rows.forEach(function(row) {
          if (row.id === 'vergas_en_un_partido') {
            const todayStr = getFormattedTodayDate();
            
            if (vergasG > 0) {
              const curG = row.g && row.g.v ? parseInt(row.g.v, 10) : 0;
              if (vergasG > curG) {
                if (!row.g) row.g = {};
                row.g.v = String(vergasG);
                row.g.d = todayStr;
              }
            }

            if (vergasM > 0) {

              if (vergasM > curM) {
                if (!row.m) row.m = {};

                row.m.d = todayStr;

  // --- Comentarios Mayor paliza ---
  const PALIZA_COMMENTS_KEY = 'quintina_paliza_comments';
  let palizaComments = { g: [], m: [] };

  function loadPalizaComments() {
    try {
      const saved = localStorage.getItem(PALIZA_COMMENTS_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          palizaComments.g = Array.isArray(parsed.g) ? parsed.g : [];
          palizaComments.m = Array.isArray(parsed.m) ? parsed.m : [];
        }
      }
    } catch(e) {}
  }

  function savePalizaComments() {
    try {
      localStorage.setItem(PALIZA_COMMENTS_KEY, JSON.stringify(palizaComments));
    } catch(e) {}
  }

  function togglePalizaComments(player) {
    const panel = document.getElementById('paliza-comments-panel-' + player);
    if (!panel) return;
    const isOpen = panel.classList.contains('open');
    document.querySelectorAll('.rec-comments-panel').forEach(p => p.classList.remove('open'));
    if (!isOpen) panel.classList.add('open');
  }

  function addPalizaComment(player) {
    const input = document.getElementById('paliza-comment-input-' + player);
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const entry = { text: text, date: getFormattedTodayDate(), ts: Date.now() };
    if (player === 'g') palizaComments.g.push(entry);
    else palizaComments.m.push(entry);
    input.value = '';
    savePalizaComments();
    renderPalizaComments(player);
    updatePalizaToggleBadges();
  }

  function deletePalizaComment(player, idx) {
    if (player === 'g') palizaComments.g.splice(idx, 1);
    else palizaComments.m.splice(idx, 1);
    savePalizaComments();
    renderPalizaComments(player);
    updatePalizaToggleBadges();
  }

  function renderPalizaComments(player) {
    const list = document.getElementById('paliza-comments-list-' + player);
    if (!list) return;
    const arr = player === 'g' ? palizaComments.g : palizaComments.m;
    if (arr.length === 0) {
      list.innerHTML = '<div style="font-size:0.7rem;opacity:0.6;padding:2px;">Sin comentarios</div>';
      return;
    }
    list.innerHTML = arr.map((c, i) => 
      '<div class="rec-comment-item"><span class="rec-comment-text">' + escapeHtml(c.text) + ' <span style="opacity:0.5;font-size:0.65rem;">' + (c.date||'') + '</span></span><button class="rec-comment-del" onclick="deletePalizaComment(\\'' + player + '\\',' + i + ')" title="Borrar">✕</button></div>'
    ).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function updatePalizaToggleBadges() {
    ['g','m'].forEach(p => {
      const badge = document.getElementById('paliza-badge-' + p);
      if (badge) {
        const count = p === 'g' ? palizaComments.g.length : palizaComments.m.length;
        badge.textContent = count > 0 ? count : '';
        badge.style.display = count > 0 ? 'inline-block' : 'none';
      }
    });
  }

  function renderAllPalizaComments() {
    renderPalizaComments('g');
    renderPalizaComments('m');
    updatePalizaToggleBadges();
  }



  function getBeatenRecordsMap() {
    return recordsBeatenThisMatch;
  }

  function buildRecordsPage() {
    const body = document.getElementById('recordsBody');
    body.innerHTML = '';
    const beatenMap = getBeatenRecordsMap();

    RECORDS_DATA.forEach(function(colData) {
      const colDiv = document.createElement('div');
      colDiv.className = 'records-col';

      const blockDiv = document.createElement('div');
      blockDiv.className = 'rec-block';

      if (colData.hasPlayers) {
        const hdr = document.createElement('div');
        hdr.className = 'rec-header-row';
        hdr.innerHTML = '<span class="p-title"></span><span class="p-head">Guido</span><span class="p-head">Martín</span>';
        blockDiv.appendChild(hdr);
      }

      colData.sections.forEach(function(sec) {
        const catBanner = document.createElement('div');
        catBanner.className = 'rec-cat-banner';
        catBanner.innerHTML = '<strong>' + sec.title + '</strong>';
        blockDiv.appendChild(catBanner);

        sec.rows.forEach(function(row) {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'rec-row';

          if (colData.hasPlayers) {
            const valG = getNumericValue(row.g);
            const valM = getNumericValue(row.m);
            const hasG = (row.g && (row.g.v !== undefined || row.g.check !== undefined));
            const hasM = (row.m && (row.m.v !== undefined || row.m.check !== undefined));

            let bgG = 'gray';
            let bgM = 'gray';

            if (hasG && hasM && valG !== null && valM !== null) {
              const mode = sec.compareMode || 'max_green';
              if (valG === valM) {
                bgG = 'gray';
                bgM = 'gray';
              } else if (mode === 'min_green') {
                if (valG < valM) { bgG = 'green'; bgM = 'red'; }
                else { bgG = 'red'; bgM = 'green'; }
              } else {
                if (valG > valM) { bgG = 'green'; bgM = 'red'; }
                else { bgG = 'red'; bgM = 'green'; }
              }
            } else if (hasG && !hasM) {
              bgG = 'gray';
            } else if (!hasG && hasM) {
              bgM = 'gray';
            }

            if (row.id === 'mayor_paliza_historia') {
              rowDiv.classList.add('has-comments');
              const countG = palizaComments.g ? palizaComments.g.length : 0;
              const countM = palizaComments.m ? palizaComments.m.length : 0;
              function cellInner(data) {
                if (!data) return '';
                if (data.check !== undefined) {
                  return (data.check ? '<span class="rec-check">✓</span>' : '') + (data.d ? '<span class="rec-date">' + data.d + '</span>' : '');
                }
                return (data.v !== undefined && data.v !== '' ? '<span class="rec-num">' + data.v + '</span>' : '') + (data.d ? '<span class="rec-date">' + data.d + '</span>' : '');
              }
              rowDiv.innerHTML =
                '<div class="rec-label">' + row.label + '</div>' +
                '<div class="rec-val-cell with-comments bg-' + bgG + '">' +
                  cellInner(row.g) +
                  '<button class="rec-comments-toggle" onclick="togglePalizaComments(\\'g\\')">💬 <span id="paliza-badge-g" class="rec-comments-badge" style="display:' + (countG>0?'inline-block':'none') + '">' + (countG>0?countG:'') + '</span></button>' +
                '</div>' +
                '<div class="rec-val-cell with-comments bg-' + bgM + '">' +
                  cellInner(row.m) +
                  '<button class="rec-comments-toggle" onclick="togglePalizaComments(\\'m\\')">💬 <span id="paliza-badge-m" class="rec-comments-badge" style="display:' + (countM>0?'inline-block':'none') + '">' + (countM>0?countM:'') + '</span></button>' +
                '</div>' +
                '<div id="paliza-comments-panel-g" class="rec-comments-panel rec-comments-panel-g">' +
                  '<div class="rec-comments-header">Comentarios Guido <span id="paliza-count-g">' + countG + ' comentarios</span></div>' +
                  '<div id="paliza-comments-list-g" class="rec-comments-list"></div>' +
                  '<div class="rec-comment-input-row"><input id="paliza-comment-input-g" class="rec-comment-input" placeholder="Agregar comentario..." onkeydown="if(event.key===\\'Enter\\') addPalizaComment(\\'g\\')"><button class="rec-comment-add" onclick="addPalizaComment(\\'g\\')">+</button></div>' +
                '</div>' +
                '<div id="paliza-comments-panel-m" class="rec-comments-panel rec-comments-panel-m">' +
                  '<div class="rec-comments-header">Comentarios Martín <span id="paliza-count-m">' + countM + ' comentarios</span></div>' +
                  '<div id="paliza-comments-list-m" class="rec-comments-list"></div>' +
                  '<div class="rec-comment-input-row"><input id="paliza-comment-input-m" class="rec-comment-input" placeholder="Agregar comentario..." onkeydown="if(event.key===\\'Enter\\') addPalizaComment(\\'m\\')"><button class="rec-comment-add" onclick="addPalizaComment(\\'m\\')">+</button></div>' +
                '</div>';
            } else {
              const beatenRow = beatenMap[row.id];
              const manualG = manuallyEditedRecordCells.has(row.label + '|g');
              const manualM = manuallyEditedRecordCells.has(row.label + '|m');
              rowDiv.innerHTML =
                '<div class="rec-label">' + row.label + '</div>' +

  function bkCopy() {
    const ta = document.getElementById('bkText');
    const text = ta.value;
    function fallback() {
      try {
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand && document.execCommand('copy');
        bkSetStatus(ok ? 'Copiado ✓' : 'Texto seleccionado: mantené pulsado y elegí Copiar', !ok);
      } catch (e) {
        bkSetStatus('Texto seleccionado: mantené pulsado y elegí Copiar', true);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { bkSetStatus('Copiado ✓', false); }, fallback);
    } else {
      fallback();
    }
  }

  function bkShare() {
    const text = document.getElementById('bkText').value;
    if (!navigator.share) { bkSetStatus('Compartir no está disponible aquí. Usá Copiar.', true); return; }
    let payload = { title: 'Respaldo Quintina', text: text };
    try {
      const file = new File([text], 'quintina-respaldo.json', { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) payload = { title: 'Respaldo Quintina', files: [file] };
    } catch (e) {}
    navigator.share(payload).then(function() { bkSetStatus('Compartido ✓', false); }, function(err) {
      if (err && err.name === 'AbortError') return;
      bkSetStatus('No se pudo compartir. Usá Copiar.', true);
    });

  function bkDownload() {
    const text = document.getElementById('bkText').value;
    const now = new Date();
    const pad = function(n) { return String(n).padStart(2, '0'); };
    const stamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes());
    const filename = 'quintina-respaldo_' + stamp + '.json';

    if (isIOS() && navigator.share) {
      try {
        const file = new File([text], filename, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ title: 'Respaldo Quintina', files: [file] }).then(function() {
            bkSetStatus('Elegí "Guardar en Archivos" en la hoja ✓', false);
          }, function(err) {
            if (err && err.name === 'AbortError') return;
            bkSetStatus('No se pudo guardar. Usá Copiar.', true);
          });
          return;
        }
      } catch (e) {}
    }

    try {
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      bkSetStatus('Archivo descargado ✓', false);
    } catch (e) {
      bkSetStatus('No se pudo descargar el archivo. Usá Copiar o Compartir.', true);

  }

  function formatShortDate(str) {
    if (!str) return '';
    str = String(str).trim();
    // Expect dd/mm/yy or dd/mm/yyyy or dd/mm/aa
    const parts = str.split('/');
    if (parts.length !== 3) return str;
    let dd = parts[0].padStart(2,'0');
    let mm = parts[1].padStart(2,'0');
    let yy = parts[2];
    // if yyyy -> yy
    if (yy.length === 4) yy = yy.slice(-2);
    // if >2 take last 2
    if (yy.length > 2) yy = yy.slice(-2);
    return dd + '/' + mm + '/' + yy;
  }

  function onHistFocus(el) {
    if (el.classList.contains('frozen-cell')) { el.blur(); return; }
    el._prev = el.textContent.trim();
    setTimeout(function() {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 0);
  }
  function onHistKey(el, e) {
    if (el.classList.contains('frozen-cell')) { e.preventDefault(); return; }
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.textContent = el._prev || '0'; el.blur(); }
  }
  function onHistBlur(el) {
    if (el.classList.contains('frozen-cell')) return;
    const rowIdx = parseInt(el.dataset.row, 10);
    const player = el.dataset.player;
    const field = el.dataset.field;
    let raw = el.textContent.trim().replace(/[^\-0-9]/g, '');
    if (raw === '' || raw === '-') raw = '0';
    let val = parseInt(raw, 10);
    if (isNaN(val)) val = 0;
    const row = HISTORIAL[rowIdx];
    if (!row) return;
    if (player === 'row') {
      row[field] = val;
      saveRow15State();
      buildHistorialTable();
      return;
    }
    const target = player === 'g' ? row.g : row.m;
    if (field === 'pts') {
      target.pts = val;
      if (player === 'g') row._manualPtsG = true; else row._manualPtsM = true;
    } else {
      const oldQ = (field === 'q') ? (target.q || 0) : null;
      target[field] = val;
      // Solo la fila actual recalcula los puntos; las filas anteriores conservan los que tienen
      if (rowIdx >= 14 && (field === 'pg' || field === 'q' || field === 'd')) {
        if (player === 'g' && !row._manualPtsG) row.g.pts = (row.g.pg||0)+(row.g.q||0)+Math.floor((row.g.d||0)/3);
        if (player === 'm' && !row._manualPtsM) row.m.pts = (row.m.pg||0)+(row.m.q||0)+Math.floor((row.m.d||0)/3);
      }
      if (field === 'q') {
        checkAndUpdateQuintinasRecord(player === 'g' ? val : null, player === 'm' ? val : null);
        if (val > oldQ) updateFechaUltimaQuintina(player);
      }
      if (field === 'd') {
        checkAndUpdateDormidasCampeonatoRecord(player === 'g' ? val : null, player === 'm' ? val : null);
      }
    }
    saveRow15State();
    buildHistorialTable();
  }


  function onRachaFocus(el) {
    el._prev = el.textContent.trim();
    setTimeout(function() {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 0);
  }
  function onRachaKey(el, e) {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.textContent = el._prev || '0'; el.blur(); }
  }
  function onRachaBlur(el) {
    let raw = el.textContent.trim().replace(/[^0-9]/g, '');
    let val = parseInt(raw, 10);
    if (isNaN(val)) val = 0;
    const row = HISTORIAL[currentRowIndex];
    if (!row) return;
    const target = el.dataset.player === 'g' ? row.g : row.m;
    if ((target.racha || 0) === val) { el.textContent = val; return; }
    target.racha = val;
    checkAndUpdateRachaRecord(el.dataset.player === 'g' ? val : null, el.dataset.player === 'm' ? val : null);
    saveRow15State();
    buildHistorialTable();
  }

  function saveEditRow15() {
    const row15 = HISTORIAL[currentRowIndex];
    const oldQG = row15.g.q || 0;
    const oldQM = row15.m.q || 0;
    row15.g.pg = parseInt(document.getElementById('editG_pg').value, 10) || 0;
    row15.g.v = parseInt(document.getElementById('editG_v').value, 10) || 0;
    row15.g.d = parseInt(document.getElementById('editG_d').value, 10) || 0;
    row15.g.q = parseInt(document.getElementById('editG_q').value, 10) || 0;

    row15.m.pg = parseInt(document.getElementById('editM_pg').value, 10) || 0;
    row15.m.v = parseInt(document.getElementById('editM_v').value, 10) || 0;
    row15.m.d = parseInt(document.getElementById('editM_d').value, 10) || 0;
    row15.m.q = parseInt(document.getElementById('editM_q').value, 10) || 0;
    if (row15.g.q > oldQG) updateFechaUltimaQuintina('g');
    if (row15.m.q > oldQM) updateFechaUltimaQuintina('m');
    checkAndUpdateDormidasCampeonatoRecord(row15.g.d, row15.m.d);

    row15.g.pts = row15.g.pg + row15.g.q + Math.floor((row15.g.d || 0) / 3);
    row15.m.pts = row15.m.pg + row15.m.q + Math.floor((row15.m.d || 0) / 3);
    checkAndUpdateQuintinasRecord(row15.g.q, row15.m.q);

    row15.g.dif = row15.g.pts - row15.m.pts;
    row15.m.dif = row15.m.pts - row15.g.pts;

    row15.x = parseInt(document.getElementById('edit_x').value, 10) || 0;
    row15.jugados = parseInt(document.getElementById('edit_jugados').value, 10) || 0;

    closeEditRow15Modal();

  function computeCurrentGameData() {
    const weighted = computeWeightedMatchResult();
    const boardsWonG = weighted.boardsWonG;
    const boardsWonM = weighted.boardsWonM;
    const vergasG = parseInt(document.getElementById('vergas-G').textContent || '0', 10);
    const vergasM = parseInt(document.getElementById('vergas-M').textContent || '0', 10);
    const isQuintinaG = (boardsWonG === BOARDS);
    const isQuintinaM = (boardsWonM === BOARDS);
    const valDormidaG = parseInt(dormidaG, 10) || 0;
    const valDormidaM = parseInt(dormidaM, 10) || 0;
    const basePtsG = boardsWonG;
    const basePtsM = boardsWonM;
    const qG = (isQuintinaG && valDormidaM === 0) ? 1 : 0;
    const qM = (isQuintinaM && valDormidaG === 0) ? 1 : 0;
    const dUnitsG = Math.floor(valDormidaG / 3);
    const dUnitsM = Math.floor(valDormidaM / 3);
    const ptsG = basePtsG + dUnitsG + qG;
    const ptsM = basePtsM + dUnitsM + qM;
    return {
      g: { pts: ptsG, pg: boardsWonG, dUnits: dUnitsG, v: vergasG, dVal: valDormidaG, q: qG, weighted: weighted.weightedG, total: weighted.totalG },
      m: { pts: ptsM, pg: boardsWonM, dUnits: dUnitsM, v: vergasM, dVal: valDormidaM, q: qM, weighted: weighted.weightedM, total: weighted.totalM },
      boardsWonG: boardsWonG, boardsWonM: boardsWonM,
      weightedG: weighted.weightedG, weightedM: weighted.weightedM,
      totalG: weighted.totalG, totalM: weighted.totalM,
      matchWinner: weighted.winner
    };
  }

      row15.m.racha = 0;
      checkAndUpdateRachaRecord(row15.g.racha, 0);

    row15.m.q += game.m.q;

    row15.g.dif = row15.g.pts - row15.m.pts;
    row15.m.dif = row15.m.pts - row15.g.pts;
